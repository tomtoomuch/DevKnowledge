services:
  frontend:
    image: devknowledge-frontend:latest
    build:
      context: ./frontend/ui-app
      dockerfile: Dockerfile
    # No host port: only Express Gateway is the external entry point.
    expose:
      - "80"
    networks:
      - dmz
    restart: unless-stopped

  api-gateway:
    image: api-gateway:latest
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      KMS_BASE_URL: http://api-kms:8000
      KMS_TIMEOUT_MS: ${KMS_TIMEOUT_MS:-10000}
      GATEWAY_PUBLIC_SCHEME: ${GATEWAY_PUBLIC_SCHEME:-http}
      AUTH_MODE: required
      NODE_ENV: production
      FRONTEND_BASE_URL: http://frontend:80
    # This is the ONLY published port, serving both Angular and /api/v1.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:${GATEWAY_PORT:-3000}"
    expose:
      - "${GATEWAY_PORT:-3000}"
    networks:
      - dmz
      - internal
    depends_on:
      api-kms:
        condition: service_healthy
      frontend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.GATEWAY_PORT + '/health/ready', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  api-kms:
    image: api-kms:latest
    build:
      context: ./backend/knowledge-service
      dockerfile: Dockerfile
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE_required}
      MONGODB_USERNAME: ${MONGODB_APP_USERNAME:?MONGODB_APP_USERNAME_required}
      MONGODB_PASSWORD: ${MONGODB_APP_PASSWORD:?MONGODB_APP_PASSWORD_required}
      MONGODB_AUTH_SOURCE: ${MONGODB_AUTH_SOURCE:?MONGODB_AUTH_SOURCE_required}
      AUTH_MODE: required
      KMS_NETWORK_GUARD: required
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  collector:
    image: devknowledge-collector:latest
    build:
      context: ./backend/collector
      dockerfile: Dockerfile
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      GPU_MONITOR_ENABLED: "false"
      COLLECTOR_NETWORK_GUARD: required
      METRICS_DB_PATH: /var/lib/devknowledge-supervisor/metrics.sqlite3
      METRICS_SAMPLE_INTERVAL_MS: "60000"
    networks:
      - internal
    # Writable data volume despite an otherwise read-only container filesystem.
    volumes:
      - supervisor-metrics:/var/lib/devknowledge-supervisor
    expose:
      - "9109"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9109/health', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME_required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD_required}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE_required}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE_required}
      MONGODB_APP_USERNAME: ${MONGODB_APP_USERNAME:?MONGODB_APP_USERNAME_required}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:?MONGODB_APP_PASSWORD_required}
    networks:
      - internal
    volumes:
      - mongodb:/data/db
      # Explicitly named to avoid anonymous volumes after container recreation.
      - mongodb-configdb:/data/configdb
      # Scripts officiels d'initialisation : executes uniquement sur volume vierge.
      - ./backend/mongodb/init/01-create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  mongodb:
    driver: local
  mongodb-configdb:
    driver: local
  supervisor-metrics:
    driver: local

networks:
  # The frontend and Gateway share only this edge network.
  # It is Compose-managed and NOT an existing/public Docker external network.
  dmz:
    driver: bridge
  # KMS, MongoDB and Collector have no route to the external Internet.
  internal:
    driver: bridge
    internal: true
