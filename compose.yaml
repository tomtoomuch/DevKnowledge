services:
  frontend:
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
    image: devknowledge-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    image: api-gateway:latest
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      KMS_BASE_URL: http://api-kms:8000
      KMS_TIMEOUT_MS: ${KMS_TIMEOUT_MS:-10000}
      GATEWAY_PUBLIC_SCHEME: ${GATEWAY_PUBLIC_SCHEME:-http}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3000}:${GATEWAY_PORT:-3000}"
    depends_on:
      api-kms:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.GATEWAY_PORT + '/health/ready', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  api-kms:
    image: api-kms:latest
    build:
      context: ./backend/knowledge-service
      dockerfile: Dockerfile
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE_required}
      MONGODB_USERNAME: ${MONGODB_APP_USERNAME:?MONGODB_APP_USERNAME_required}
      MONGODB_PASSWORD: ${MONGODB_APP_PASSWORD:?MONGODB_APP_PASSWORD_required}
      MONGODB_AUTH_SOURCE: ${MONGODB_AUTH_SOURCE:?MONGODB_AUTH_SOURCE_required}
      AUTH_MODE: required
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME_required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD_required}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE_required}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE_required}
      MONGODB_APP_USERNAME: ${MONGODB_APP_USERNAME:?MONGODB_APP_USERNAME_required}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:?MONGODB_APP_PASSWORD_required}
    volumes:
      - mongodb:/data/db
      # Scripts officiels d'initialisation : executes uniquement sur volume vierge.
      - ./backend/mongodb/init/01-create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mongodb:
