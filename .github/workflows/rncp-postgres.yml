name: PostgreSQL RNCP foundation (isolated)

on:
  pull_request:
    paths:
      - 'backend/knowledge-service/app/rncp/**'
      - 'poc/rncp-postgres/**'
      - '.github/workflows/rncp-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rncp-postgres:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run true PostgreSQL 17/FastAPI integration on fake RNCP data
        run: python3 poc/rncp-postgres/run.py
      - name: Publish verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rncp-postgres-verification
          path: test-results/rncp-postgres
          retention-days: 14
