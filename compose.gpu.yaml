# Optional NVIDIA telemetry overlay: never required for the default offline stack.
# docker compose --env-file .env -f compose.yaml -f compose.gpu.yaml --profile gpu up -d --build
services:
  api-kms:
    environment:
      GPU_MONITOR_ENABLED: "true"

  gpu-monitor:
    profiles: ["gpu"]
    image: devknowledge-gpu-monitor:latest
    build:
      context: ./backend/gpu-monitor
      dockerfile: Dockerfile
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    expose:
      - "9109"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9109/health', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
