# Optional GPU overlay for the always-on collector (base Compose works without a GPU).
# docker compose --env-file .env -f compose.yaml -f compose.gpu.yaml up -d --build
services:
  collector:
    environment:
      GPU_MONITOR_ENABLED: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
