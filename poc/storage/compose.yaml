# Independent, opt-in test stack. Never combine with the main DevKnowledge Compose.
# run.py chooses a unique Compose project name and generates disposable credentials.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${POC_MSSQL_PASSWORD:?generated_by_runner}
    volumes:
      - sqlserver_poc_data:/var/opt/mssql
      - ./sqlserver:/sql:ro
    networks: [poc_isolated]
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 5 -b -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      retries: 24
      timeout: 10s
      start_period: 35s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POC_POSTGRES_PASSWORD:?generated_by_runner}
      POSTGRES_DB: devknowledge_poc
    volumes:
      - postgres_poc_data:/var/lib/postgresql/data
      - ./postgres:/sql:ro
    networks: [poc_isolated]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devknowledge_poc"]
      interval: 5s
      retries: 20
      timeout: 5s
      start_period: 15s

volumes:
  sqlserver_poc_data:
  postgres_poc_data:

networks:
  poc_isolated:
    internal: true
    driver: bridge
