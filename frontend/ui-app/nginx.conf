server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location /api/ {
        proxy_pass http://api-gateway:${GATEWAY_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        client_max_body_size 1m;
    }

    # Stable Nginx liveness probe, consumed only through the Gateway by Collector.
    location = /health/frontend {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    location = /health/ready {
        proxy_pass http://api-gateway:${GATEWAY_PORT}/health/ready;
        proxy_set_header Host api-gateway:${GATEWAY_PORT};
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
