server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Nginx is private. All browser traffic, including static assets,
    # enters through the Express Gateway first.
    # Deny accidental API exposure even from within the DMZ.
    location ^~ /api/ {
        return 404;
    }

    location = /health/frontend {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
